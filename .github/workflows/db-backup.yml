name: Weekly DB Backup (Turso -> encrypted artifact)

# 운영 Turso DB의 일간 오프사이트 백업 (RUNBOOK §4-2, C-2 결정 2026-06-07, 매일·14일 보존으로 갱신 2026-06-14).
# PITR(1차)이 Turso 계정·DB 가 살아있을 때만 유효하므로, 계정 손실·오삭제 대비
# Turso 바깥(GitHub Actions 아티팩트)에 암호화된 dump 사본을 둔다.
#
# 읽기 전용(dump)만 수행 — 운영 DB 에 어떤 쓰기도 하지 않는다.
#
# 1회 설정 (자세한 절차는 docs/RUNBOOK.md §4-2):
#   - Repo 변수 TURSO_DB_NAME   : 운영 DB 이름 (turso db list / 대시보드)
#   - Secret  TURSO_API_TOKEN   : Turso 플랫폼 API 토큰 (대시보드 Account -> API Tokens)
#   - Secret  BACKUP_AGE_PUBLIC_KEY : age 공개키(age1...). private key 는 절대 GitHub 에 두지 말 것
#
# 복호화는 오프라인 보관된 age private key 로만 가능 (RUNBOOK §4-3).

on:
  schedule:
    - cron: "0 18 * * *" # 매일 18:00 UTC = 03:00 KST (저트래픽 시간대)
  workflow_dispatch: {} # 수동 즉시 실행

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Turso CLI
        run: |
          curl -sSfL https://get.tur.so/install.sh | bash
          echo "$HOME/.turso" >> "$GITHUB_PATH"

      - name: Install age (encryption)
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Dump database
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          DB_NAME: ${{ vars.TURSO_DB_NAME }}
        run: |
          if [ -z "$DB_NAME" ]; then
            echo "::error::TURSO_DB_NAME repo 변수가 비어 있습니다. Settings -> Variables 에서 설정하세요."
            exit 1
          fi
          if [ -z "$TURSO_API_TOKEN" ]; then
            echo "::error::TURSO_API_TOKEN secret 이 없습니다."
            exit 1
          fi
          # turso CLI 에는 db dump 서브커맨드가 없음 — shell 의 .dump 로 SQL 텍스트를 추출한다 (Turso 공식 백업 방식).
          # (db dump --output 으로 되돌리지 말 것: unknown flag 로 매번 실패함)
          turso db shell "$DB_NAME" ".dump" > dump.sql

      - name: Sanity check (빈/손상 백업 차단)
        run: |
          # 인증 실패 등으로 조용히 빈 파일이 만들어지는 것을 '성공'으로 보관하지 않는다.
          test -s dump.sql || { echo "::error::dump.sql 이 비어 있음 — 백업 실패 처리"; exit 1; }
          grep -q "CREATE TABLE" dump.sql || { echo "::error::CREATE TABLE 없음 — 손상된 dump"; exit 1; }
          echo "dump 크기: $(wc -c < dump.sql) bytes / 테이블 $(grep -c 'CREATE TABLE' dump.sql) 개"

      - name: Encrypt (age, 공개키 수신자)
        env:
          AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          if [ -z "$AGE_RECIPIENT" ]; then
            echo "::error::BACKUP_AGE_PUBLIC_KEY secret 이 없습니다. age-keygen 으로 키페어 생성 후 공개키 등록."
            exit 1
          fi
          age -r "$AGE_RECIPIENT" -o dump.sql.age dump.sql
          rm -f dump.sql # 평문 PII 즉시 삭제 (암호문만 업로드)

      - name: Timestamp
        id: meta
        run: echo "stamp=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: intervia-db-${{ steps.meta.outputs.stamp }}
          path: dump.sql.age
          retention-days: 14
          if-no-files-found: error
